name: aspen-platform-example

services:
  db:
    image: postgres:18-alpine
    container_name: aspen-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aspen
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: aspen
      PGDATA: /var/lib/postgresql/18/data
      POSTGRES_INITDB_ARGS: "--data-checksums --encoding=UTF8"
    command:
      - postgres
      - -c config_file=/etc/postgresql/postgresql.conf
      # # --- CONNECTIVITY & AUTH ---
      # - -c listen_addresses=*
      # - -c password_encryption=scram-sha-256
      # - -c ssl=on
      # - -c ssl_cert_file=/etc/postgresql/ssl/server.crt
      # - -c ssl_key_file=/etc/postgresql/ssl/server.key
      # - -c ssl_min_protocol_version=TLSv1.2
      # --- RESOURCE TUNING (adjust to host memory) ---
      - -c shared_buffers=256MB
      - -c max_connections=200
      - -c effective_cache_size=1GB
      - -c work_mem=8MB
      - -c maintenance_work_mem=64MB
      # --- WAL / DURABILITY & REPLICATION ---
      - -c wal_level=replica
      - -c max_wal_senders=10
      - -c max_replication_slots=10
      - -c synchronous_commit=on
      # --- PERFORMANCE ---
      - -c checkpoint_completion_target=0.9
      - -c max_worker_processes=8
      - -c max_parallel_workers_per_gather=4
      - -c max_parallel_workers=8
      # --- LOGGING ---
      - -c log_min_duration_statement=100
      - -c log_statement=ddl
      - -c log_checkpoints=on
      - -c log_connections=on
      - -c log_disconnections=on
      # --- RLS Disabled ---
      - -c row_security=off
    volumes:
      - postgres-data:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspen -d aspen"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
